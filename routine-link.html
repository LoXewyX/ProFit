<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111412" />
    <title>Open routine · ProFit</title>
    <style>
      :root{--accent:#d2f476;--accent-ink:#1a2114;color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#111412;color:#edf1e9}*{box-sizing:border-box}body{min-height:100vh;min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#263123 0,transparent 58%),#111412}.card{width:min(100%,420px);padding:26px;border:1px solid #303831;border-radius:16px;background:#191e1a;box-shadow:0 24px 80px #0008}.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;color:#edf1e9;font-size:17px;font-weight:750;letter-spacing:-.5px}.mark{display:grid;width:34px;height:34px;place-items:center;border-radius:10px;background:#d2f476;color:#1a2114}.mark svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.eyebrow{color:#a5b68c;font-size:10px;font-weight:750;letter-spacing:1px;text-transform:uppercase}.card h1{margin:8px 0;color:#edf1e9;font-size:23px;letter-spacing:-.6px}.card p{margin:0;color:#a4aea0;font-size:14px;line-height:1.55}.actions{display:grid;gap:9px;margin-top:22px}.button{min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border:1px solid #46543a;border-radius:10px;background:#d2f476;color:#1a2114;font-size:14px;font-weight:700;text-decoration:none}.button.secondary{border-color:#343c34;background:#20251f;color:#d6ddd2}.button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.error{display:none;margin-top:16px;color:#ef9a91;font-size:13px}

      .brand-mark{display:flex;align-items:center;justify-content:center;gap:2px}
      .brand-mark i{display:block;width:4px;border-radius:4px;background:var(--accent-ink);transform:skew(-18deg)}
      .brand-mark i:nth-child(1){height:10px;opacity:.58}
      .brand-mark i:nth-child(2){height:16px;opacity:.8}
      .brand-mark i:nth-child(3){height:22px}
      .brand-mark{background:transparent}
      .brand-mark i{background:var(--accent)}
      .brand{gap:10px;font-size:1rem}
      .brand>span>span{color:var(--accent)}
      .brand-mark{width:auto;height:23px;padding:0 3px;border-radius:0;background:transparent;transform:skew(-18deg)}
      .brand-mark i{width:5px;transform:none;transform-origin:center bottom;animation:profit-logo-glow 2.8s ease-in-out infinite}
      .brand-mark i:nth-child(1){height:11px;opacity:.55}
      .brand-mark i:nth-child(2){height:18px;opacity:.8;animation-delay:.14s}
      .brand-mark i:nth-child(3){height:23px;animation-delay:.28s}
    </style>
  </head>
  <body>
    <main class="card">
      <a class="brand" href="https://loxewyx.github.io/ProFit/" aria-label="ProFit"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>pro<span>fit</span></span></a>
      <span class="eyebrow" id="eyebrow">Routine link</span>
      <h1 id="title">Open this routine in ProFit</h1>
      <p id="description">Continue in the ProFit app to add this routine to your library.</p>
      <div class="actions">
        <a class="button" id="open-app" href="#"><svg viewBox="0 0 24 24"><path d="M13 5h6v6M19 5l-9 9"/><path d="M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span id="open-label">Open in ProFit</span></a>
        <a class="button secondary" id="github" href="https://github.com/LoXewyX/ProFit" rel="noreferrer"><span id="github-label">Open GitHub repository</span></a>
      </div>
      <div class="error" id="error" role="status"></div>
    </main>
    <script>
      (() => {
        const repo = "https://github.com/LoXewyX/ProFit";
        const params = new URLSearchParams(location.search);
        const payload = params.get("p") || "";
        const language = (navigator.languages || [navigator.language || "en"]).map((item) => String(item).toLowerCase().split("-")[0]).find((item) => ["en","es","ca","fr","de","it"].includes(item)) || "en";
        const copy = {
          en:["Routine link","Open this routine in ProFit","Continue in the ProFit app to add this routine to your library.","Open in ProFit","Open GitHub repository","This routine link is invalid."],
          es:["Enlace de rutina","Abre esta rutina en ProFit","Continúa en la app de ProFit para añadir la rutina a tu biblioteca.","Abrir en ProFit","Abrir el repositorio de GitHub","El enlace de esta rutina no es válido."],
          ca:["Enllaç de rutina","Obre aquesta rutina a ProFit","Continua a l’app de ProFit per afegir la rutina a la biblioteca.","Obre a ProFit","Obre el repositori de GitHub","L’enllaç d’aquesta rutina no és vàlid."],
          fr:["Lien de séance","Ouvrir cette séance dans ProFit","Continuez dans l’application ProFit pour ajouter cette séance à votre bibliothèque.","Ouvrir dans ProFit","Ouvrir le dépôt GitHub","Ce lien de séance n’est pas valide."],
          de:["Trainingslink","Dieses Training in ProFit öffnen","Öffne die ProFit-App, um das Training zu deiner Bibliothek hinzuzufügen.","In ProFit öffnen","GitHub-Repository öffnen","Dieser Trainingslink ist ungültig."],
          it:["Link allenamento","Apri questo allenamento in ProFit","Continua nell’app ProFit per aggiungere l’allenamento alla libreria.","Apri in ProFit","Apri il repository GitHub","Il link dell’allenamento non è valido."]
        }[language];
        document.documentElement.lang = language;
        ["eyebrow","title","description","open-label","github-label"].forEach((id,index) => { document.getElementById(id).textContent = copy[index]; });
        const openApp = document.getElementById("open-app");
        document.getElementById("github").href = repo;
        if (!/^lz1[A-Za-z0-9_$-]+$/.test(payload) && !/^[A-Za-z0-9_$-]+$/.test(payload)) {
          document.getElementById("title").textContent = copy[1];
          document.getElementById("description").textContent = copy[5];
          document.getElementById("error").textContent = copy[5];
          document.getElementById("error").style.display = "block";
          openApp.href = repo;
          return;
        }
        openApp.href = `intent://routine-plan/${encodeURIComponent(payload)}#Intent;scheme=profit;package=com.loxewyx.profit;S.browser_fallback_url=${encodeURIComponent(repo)};end`;
        if (/Android/i.test(navigator.userAgent)) window.location.replace(openApp.href);
        else openApp.href = repo;
      })();
    </script>
  </body>
</html>
