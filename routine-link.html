<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111612" />
    <title>Opening routine · ProFit</title>
    <style>
      :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#111612;color:#f2f5ef;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 15%,#273226 0,#111612 62%)}main{width:min(100%,420px);padding:28px;border:1px solid #343b32;border-radius:22px;background:#1a201b;box-shadow:0 24px 90px #0007;text-align:center}.mark{width:56px;height:56px;margin:0 auto 20px;display:grid;place-items:center;border-radius:16px;background:#d2f476;color:#111612;font-size:30px;font-weight:900}h1{margin:0 0 10px;font-size:24px;letter-spacing:-.04em}p{margin:0;color:#aab2a5;line-height:1.55}.loading{height:3px;margin:24px 0 18px;overflow:hidden;border-radius:5px;background:#333b30}.loading i{display:block;width:38%;height:100%;border-radius:inherit;background:#d2f476;animation:move 1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(165%)}}a{display:inline-flex;justify-content:center;align-items:center;min-height:48px;margin-top:8px;padding:0 20px;border-radius:14px;background:#d2f476;color:#111612;font-weight:750;text-decoration:none}small{display:block;margin-top:14px;color:#858d81;font-size:12px}
    </style>
    <style>
      .mark{display:flex;align-items:center;justify-content:center;gap:4px;background:transparent}
      .mark span{display:block;width:6px;border-radius:5px;background:#d2f476;transform:skew(-18deg)}
      .mark span:nth-child(1){height:18px;opacity:.58}
      .mark span:nth-child(2){height:28px;opacity:.8}
      .mark span:nth-child(3){height:38px}
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1 id="heading">Opening your routine</h1>
      <p id="message">Connecting to ProFit…</p>
      <div class="loading" aria-hidden="true"><i></i></div>
      <a id="open" href="https://loxewyx.github.io/ProFit/">Open ProFit</a>
      <small id="hint">If the app is installed, it will open automatically.</small>
    </main>
    <script>
      (() => {
        const appUrl = "https://loxewyx.github.io/ProFit/";
        const params = new URLSearchParams(location.search);
        const plan = params.get("plan") || "";
        const copy = {
          es: ["Abriendo tu rutina", "Conectando con ProFit…", "Abrir ProFit", "Si tienes la app instalada, se abrirá automáticamente."],
          ca: ["S’està obrint la rutina", "S’està connectant amb ProFit…", "Obre ProFit", "Si tens l’app instal·lada, s’obrirà automàticament."],
          fr: ["Ouverture de votre séance", "Connexion à ProFit…", "Ouvrir ProFit", "Si l’application est installée, elle s’ouvrira automatiquement."],
          de: ["Training wird geöffnet", "Verbindung mit ProFit…", "ProFit öffnen", "Wenn die App installiert ist, wird sie automatisch geöffnet."],
          it: ["Apertura dell’allenamento", "Connessione a ProFit…", "Apri ProFit", "Se l’app è installata, si aprirà automaticamente."],
          en: ["Opening your routine", "Connecting to ProFit…", "Open ProFit", "If the app is installed, it will open automatically."]
        };
        const language = (navigator.languages || [navigator.language]).map((item) => item.toLowerCase().split("-")[0]).find((item) => copy[item]) || "en";
        const [heading, message, action, hint] = copy[language];
        document.documentElement.lang = language;
        document.getElementById("heading").textContent = heading;
        document.getElementById("message").textContent = message;
        document.getElementById("hint").textContent = hint;
        const open = document.getElementById("open");
        const fallback = `${appUrl}#routine-plan=${plan}`;
        open.textContent = action;
        open.href = fallback;
        if (!/^[A-Za-z0-9_-]{1,64000}$/.test(plan)) {
          document.getElementById("message").textContent = language === "es" ? "El enlace no contiene una rutina válida." : "This link does not contain a valid routine.";
          return;
        }
        if (!/Android/i.test(navigator.userAgent)) {
          location.replace(fallback);
          return;
        }
        const intent = `intent://routine-plan/${plan}#Intent;scheme=profit;package=com.loxewyx.profit;S.browser_fallback_url=${encodeURIComponent(fallback)};end`;
        let leftPage = false;
        addEventListener("pagehide", () => { leftPage = true; }, { once: true });
        location.href = intent;
        setTimeout(() => {
          if (!leftPage && document.visibilityState === "visible") location.replace(fallback);
        }, 1400);
      })();
    </script>
  </body>
</html>
