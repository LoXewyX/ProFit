apply plugin: 'com.android.dynamic-feature'

android {
    namespace 'com.loxewyx.profit.gemininano'
    compileSdk rootProject.ext.compileSdkVersion

    packaging {
        resources {
            excludes += [
                "DebugProbesKt.bin",
                "META-INF/*.version",
                "META-INF/*.kotlin_module",
                "kotlin/**"
            ]
        }
    }

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
    }

    buildTypes {
        release {
            proguardFiles 'proguard-rules.pro'
        }
    }
}

dependencies {
    compileOnly project(':app')
    implementation "com.google.mlkit:genai-prompt:1.0.0-beta5"
    compileOnly "com.google.guava:listenablefuture:1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
}

// Dynamic features inherit code from the base split at runtime. Keep libraries
// already packaged by :app out of this split to avoid duplicate classes/resources.
def baseProvidedModules = [
    'androidx.activity:activity',
    'androidx.annotation:annotation',
    'androidx.annotation:annotation-experimental',
    'androidx.appcompat:appcompat',
    'androidx.appcompat:appcompat-resources',
    'androidx.arch.core:core-common',
    'androidx.arch.core:core-runtime',
    'androidx.collection:collection',
    'androidx.concurrent:concurrent-futures',
    'androidx.core:core',
    'androidx.core:core-ktx',
    'androidx.cursoradapter:cursoradapter',
    'androidx.customview:customview',
    'androidx.drawerlayout:drawerlayout',
    'androidx.emoji2:emoji2',
    'androidx.emoji2:emoji2-views-helper',
    'androidx.fragment:fragment',
    'androidx.interpolator:interpolator',
    'androidx.lifecycle:lifecycle-common',
    'androidx.lifecycle:lifecycle-livedata',
    'androidx.lifecycle:lifecycle-livedata-core',
    'androidx.lifecycle:lifecycle-process',
    'androidx.lifecycle:lifecycle-runtime',
    'androidx.lifecycle:lifecycle-viewmodel',
    'androidx.lifecycle:lifecycle-viewmodel-savedstate',
    'androidx.loader:loader',
    'androidx.resourceinspection:resourceinspection-annotation',
    'androidx.savedstate:savedstate',
    'androidx.startup:startup-runtime',
    'androidx.tracing:tracing',
    'androidx.vectordrawable:vectordrawable',
    'androidx.vectordrawable:vectordrawable-animated',
    'androidx.versionedparcelable:versionedparcelable',
    'androidx.viewpager:viewpager',
    'com.google.android.gms:play-services-basement',
    'com.google.android.gms:play-services-tasks',
    'com.google.guava:guava',
    'com.google.guava:failureaccess',
    'com.google.code.findbugs:jsr305',
    'com.google.errorprone:error_prone_annotations',
    'com.google.j2objc:j2objc-annotations',
    'org.checkerframework:checker-qual',
    'org.jetbrains:annotations',
    'org.jetbrains.kotlin:kotlin-stdlib',
    'org.jetbrains.kotlinx:kotlinx-coroutines-android',
    'org.jetbrains.kotlinx:kotlinx-coroutines-bom',
    'org.jetbrains.kotlinx:kotlinx-coroutines-core',
    'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm',
    'com.google.guava:listenablefuture'
]

configurations.matching { it.name.toLowerCase().contains('runtime') }.configureEach {
    baseProvidedModules.each { coordinate ->
        def (groupName, moduleName) = coordinate.split(':', 2)
        exclude group: groupName, module: moduleName
    }
}
